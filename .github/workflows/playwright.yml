name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: cp .env.example .env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Write test summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');

          const resultsPath = 'test-results/results.json';
          let summary = '## Playwright summary\n\n';

          if (!fs.existsSync(resultsPath)) {
            summary += 'Results file not found.\n\n';
            summary += 'Open the `playwright-report` artifact for details.\n';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
          const stats = data.stats || {};

          summary += `| Metric | Count |\n`;
          summary += `|---|---|\n`;
          summary += `| Expected (passed) | ${stats.expected ?? 0} |\n`;
          summary += `| Failed | ${stats.unexpected ?? 0} |\n`;
          summary += `| Flaky | ${stats.flaky ?? 0} |\n`;
          summary += `| Skipped | ${stats.skipped ?? 0} |\n\n`;
          summary += `Full HTML report is available in the workflow artifacts.\n`;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          EOF

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7